<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pulse – Campaign anomaly alerts</title>
<meta name="description" content="Pulse: anomaly alerting concept for advertisers on Media.net's contextual ad network. Prototype on simulated data.">
<style>
:root{--ink:#1D3B47;--ink2:#2B5263;--accent:#E4572E;--teal:#2A7F8E;--red:#C0392B;--amber:#B57A00;--green:#3C8D5A;--slate:#6B7C8C;--blue:#2F6FB0;
--bg:#F2F5F6;--card:#fff;--line:#DCE5E8;--text:#1F2933;--muted:#5B6B78;--redbg:#FBEAE8;--amberbg:#FBF3E0;--greenbg:#E6F2EA;--bluebg:#E7EFF9;--tealbg:#E3EEF0;--accbg:#FCEBE5}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--teal)}
button,select,input{font:inherit}
.top{position:sticky;top:0;z-index:40;height:56px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px}
.brand{font-weight:800;font-size:21px;letter-spacing:-.3px;display:flex;align-items:center;gap:1px}
.brand b{display:inline-block;width:7px;height:7px;background:var(--accent);margin-left:2px;margin-top:9px}
.proto{font-size:11px;background:rgba(255,255,255,.13);padding:3px 9px;border-radius:12px;white-space:nowrap}
.clock{margin-left:auto;display:flex;gap:8px;align-items:center}
.clock .now{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.clock .now small{opacity:.7;font-weight:400;margin-right:6px}
.ibtn{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:8px;height:34px;min-width:36px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ibtn:hover{background:rgba(255,255,255,.24)}
.top select{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:8px;height:34px;padding:0 6px}
.top select option{color:#000}
.layout{display:grid;grid-template-columns:212px 1fr;min-height:calc(100vh - 56px)}
.side{background:#fff;border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
.side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:var(--text);text-decoration:none;margin-bottom:2px;font-weight:500}
.side a:hover{background:var(--bg)}
.side a.on{background:var(--tealbg);color:var(--ink);font-weight:700}
.side .cnt{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;font-weight:700}
.side .sep{border-top:1px solid var(--line);margin:12px 4px}
.side .watch{font-size:12px;color:var(--muted);padding:6px 12px}
.ico{width:18px;height:18px;flex:none}
main{padding:22px 26px 60px;max-width:1240px;width:100%;min-width:0}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.2px}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:14px;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.grid{display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;margin-top:2px}
.up{color:var(--green)}.down{color:var(--red)}.mut{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;letter-spacing:.2px}
.chip.P0{background:var(--red);color:#fff}.chip.P1{background:var(--amber);color:#fff}.chip.P2{background:var(--slate);color:#fff}.chip.P3{background:var(--green);color:#fff}
.chip.note{background:var(--blue);color:#fff}.chip.fc{background:var(--accbg);color:var(--accent)}
.chip.ok{background:var(--greenbg);color:var(--green)}.chip.warn{background:var(--amberbg);color:var(--amber)}.chip.crit{background:var(--redbg);color:var(--red)}.chip.paused{background:#ECEFF1;color:var(--slate)}
.chip.ver{background:var(--bluebg);color:var(--blue)}.chip.res{background:var(--greenbg);color:var(--green)}.chip.sn{background:#ECEFF1;color:var(--slate)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:9px;padding:0 14px;height:38px;cursor:pointer;font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--teal)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(.95)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.row-actions{display:flex;flex-wrap:wrap;gap:8px}
.banner{display:flex;align-items:center;gap:12px;border-radius:12px;padding:12px 16px;margin-bottom:14px}
.banner.red{background:var(--redbg);border:1px solid #F1C5BF}
.banner.blue{background:var(--bluebg);border:1px solid #C9DAF0}
.banner.green{background:var(--greenbg);border:1px solid #C6E2CF}
.banner .grow{flex:1;min-width:0}
.intro{background:var(--ink);color:#fff;border-radius:12px;padding:16px 18px;margin-bottom:16px;display:flex;gap:16px;align-items:center}
.intro p{margin:4px 0 0;opacity:.85}
.intro .x{margin-left:auto;display:flex;gap:8px}
.camps{display:flex;flex-direction:column}
.crow{display:grid;grid-template-columns:2.2fr .9fr 1.6fr 1.1fr 1.1fr 1fr;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.crow:hover{background:#FAFCFC}
.crow.hd{font-size:12px;color:var(--muted);font-weight:600;padding-top:8px;padding-bottom:8px;background:#FAFCFC}
.crow .nm{font-weight:600}
.ml{display:none;font-size:11px;color:var(--muted)}
.bar{height:7px;background:#E7EEF0;border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--teal);border-radius:4px}
.bar.hot i{background:var(--red)}
.alist{display:flex;flex-direction:column;gap:10px}
.acard{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-left-width:4px;border-radius:12px;padding:14px 16px}
.acard:hover{box-shadow:0 2px 10px rgba(29,59,71,.08)}
.acard.P0{border-left-color:var(--red)}.acard.P1{border-left-color:var(--amber)}.acard.P2{border-left-color:var(--slate)}.acard.note{border-left-color:var(--blue);background:#FAFCFF}.acard.res{opacity:.85}
.acard .t{font-weight:700;margin:6px 0 2px}
.acard .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:6px;align-items:center}
.money{font-weight:700;color:var(--red);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13px;color:var(--text);text-decoration:none}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ad{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);grid-template-areas:"head head" "ex act" "chart fb" "evi log";gap:14px;align-items:start}
.ad-head{grid-area:head}.ad-ex{grid-area:ex}.ad-act{grid-area:act}.ad-chart{grid-area:chart}.ad-evi{grid-area:evi}.ad-fb{grid-area:fb}.ad-log{grid-area:log}
.big{font-size:20px;font-weight:700;margin:8px 0 6px;line-height:1.3}
.livebox{display:flex;gap:22px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.livebox .l{font-size:12px;color:var(--muted)}
.livebox .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.aitag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--teal);background:var(--tealbg);padding:3px 9px;border-radius:12px}
.conf{display:flex;align-items:center;gap:10px;margin:10px 0}
.conf .track{flex:1;height:8px;background:#E7EEF0;border-radius:4px;overflow:hidden}
.conf .track i{display:block;height:100%;background:var(--teal)}
.why{margin:6px 0 10px;padding-left:18px}
.why li{margin-bottom:4px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:13px}
.kv .k{color:var(--muted)}
.checks{list-style:none;padding:0;margin:0}
.checks li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.checks li:last-child{border-bottom:0}
.ck{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none;color:#fff}
.ck.y{background:var(--green)}.ck.n{background:var(--red)}.ck.i{background:var(--slate)}
.checks .lbl{color:var(--muted);min-width:150px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
details>summary{cursor:pointer;font-weight:600;color:var(--teal);list-style:none;padding:4px 0}
details>summary::-webkit-details-marker{display:none}
details>summary:before{content:"▸ ";}
details[open]>summary:before{content:"▾ ";}
pre.json{background:#0F2530;color:#CFE3E8;padding:12px;border-radius:9px;font-size:11.5px;overflow:auto;max-height:320px;white-space:pre-wrap;word-break:break-word}
.tl{list-style:none;padding:0;margin:0}
.tl li{position:relative;padding:0 0 12px 18px;font-size:13px}
.tl li:before{content:"";position:absolute;left:4px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--teal)}
.tl li:after{content:"";position:absolute;left:7px;top:15px;bottom:0;width:1px;background:var(--line)}
.tl li:last-child:after{display:none}
.tl .w{font-size:11px;color:var(--muted)}
.ask{display:flex;gap:8px;margin-top:10px}
.ask input{flex:1;min-width:0;height:38px;border:1px solid var(--line);border-radius:9px;padding:0 12px}
.qa{margin-top:10px;font-size:13px}
.qa .q{font-weight:600;margin-top:8px}
.qa .an{background:var(--bg);border-radius:9px;padding:8px 10px;margin-top:4px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart .tip{position:absolute;top:4px;right:6px;background:var(--ink);color:#fff;font-size:12px;padding:4px 8px;border-radius:6px;pointer-events:none;display:none;white-space:nowrap}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.form{display:grid;gap:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.field input,.field select{width:100%;height:40px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:#fff}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:#fff;padding:0 12px;height:32px;cursor:pointer;font-weight:600;font-size:12px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:#fff}
.warnbox{background:var(--amberbg);border:1px solid #EBD5A6;border-radius:9px;padding:8px 10px;font-size:12.5px;margin-top:6px}
.okbox{background:var(--greenbg);border:1px solid #C6E2CF;border-radius:9px;padding:8px 10px;font-size:12.5px;margin-top:6px}
.replay{background:var(--ink);color:#fff;border-radius:12px;padding:16px}
.replay .nums{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0}
.replay .nums b{font-size:24px;display:block}
.replay .nums span{font-size:12px;opacity:.8}
.badge{font-size:10.5px;font-weight:700;background:var(--accbg);color:var(--accent);padding:1px 7px;border-radius:9px;margin-left:6px}
.step{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.step .b{flex:1;min-width:0}
.step p{margin:2px 0 8px;color:var(--muted);font-size:13px}
.injl li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:start}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.sbig{font-size:28px;font-weight:800}
.toasts{position:fixed;right:16px;top:68px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{background:#fff;border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:10px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.12);font-size:13px;cursor:pointer;animation:tin .25s ease}
.toast.P0{border-left-color:var(--red)}.toast.P1{border-left-color:var(--amber)}.toast.note{border-left-color:var(--blue)}.toast.ok{border-left-color:var(--green)}
@keyframes tin{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.modal-bg{position:fixed;inset:0;background:rgba(15,30,38,.45);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:14px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:20px}
.modal h2{margin-bottom:6px}
.modal .act{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.wa{background:#E5DDD5;border-radius:12px;padding:14px}
.wa .bub{background:#fff;border-radius:8px;padding:10px 12px;font-size:13px;max-width:92%;box-shadow:0 1px 1px rgba(0,0,0,.1);white-space:pre-wrap}
.wa .from{font-size:12px;font-weight:700;color:#075E54;margin-bottom:6px}
.variant{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.variant:hover,.variant.on{border-color:var(--accent);background:var(--accbg)}
.variant b{display:block}
.fab{position:fixed;right:18px;bottom:18px;z-index:45;background:var(--accent);color:#fff;border:0;border-radius:24px;height:46px;padding:0 18px;font-weight:700;box-shadow:0 6px 18px rgba(228,87,46,.4);cursor:pointer;display:flex;align-items:center;gap:8px}
.sheet-bg{position:fixed;inset:0;background:rgba(15,30,38,.4);z-index:65;display:flex;justify-content:flex-end}
.sheet{background:#fff;width:420px;max-width:100%;height:100%;overflow:auto;padding:18px}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.bottom{display:none}
.coach{position:fixed;right:20px;bottom:20px;z-index:66;width:400px;max-width:calc(100vw - 32px);background:#fff;border-radius:14px;box-shadow:0 12px 40px rgba(15,30,38,.28);border:1px solid var(--line);overflow:hidden}
.coach .ch{background:var(--ink);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;font-size:12px}
.coach .ch .prog{flex:1;height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin:0 12px;overflow:hidden}
.coach .ch .prog i{display:block;height:100%;background:var(--accent)}
.coach .cb{padding:14px 16px 16px}
.coach h3{font-size:16px;margin:0 0 6px}
.coach p{margin:0 0 6px;font-size:13.5px;line-height:1.5;color:#33424D}
.coach .what{background:var(--accbg);border-radius:8px;padding:8px 10px;font-size:12.5px;margin:8px 0 0;color:#7A2E16}
.coach .cbtn{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.hl{outline:3px solid var(--accent)!important;outline-offset:4px;border-radius:12px;transition:outline-color .3s}
.nexth{background:var(--accent)!important}
body.touring .fab,body.touring .sticky-act,body.touring .toasts{display:none!important}
body.touring main{padding-bottom:300px}
.sticky-act{display:none}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.nlog li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:default}
.nlog li.click{cursor:pointer}
.nlog .chn{font-size:11px;font-weight:700;border-radius:8px;padding:2px 8px;background:var(--tealbg);color:var(--ink);white-space:nowrap}
.nlog .chn.wa{background:#DCF8C6;color:#075E54}
.nlog .chn.held,.nlog .chn.digest{background:#ECEFF1;color:var(--slate)}
.nlog .chn.resent{background:var(--redbg);color:var(--red)}
.muted{color:var(--muted)}
.small{font-size:12px}
.mt{margin-top:14px}.mb{margin-bottom:14px}
.hide{display:none!important}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.three{grid-template-columns:1fr 1fr}}
@media(max-width:767px){
 body{font-size:14.5px}
 .top{padding:0 12px;gap:8px}.proto{display:none}
 .clock .now small{display:none}
 .clock .now{font-size:13px}
 .layout{grid-template-columns:1fr}.side{display:none}
 main{padding:14px 14px 96px}
 h1{font-size:19px}
 .bottom{display:flex;position:fixed;bottom:0;left:0;right:0;height:64px;padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);z-index:50}
 .bottom a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted);text-decoration:none;font-weight:600;position:relative;min-height:44px}
 .bottom a.on{color:var(--ink)}
 .bottom a .cnt{position:absolute;top:6px;left:54%;background:var(--red);color:#fff;border-radius:9px;font-size:10px;padding:0 5px}
 .kpis{grid-template-columns:1fr 1fr;gap:10px}
 .kpi .v{font-size:19px}
 .crow{grid-template-columns:1fr 1fr;gap:6px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff}
 .crow.hd{display:none}
 .crow .nm{grid-column:1/-1}
 .crow .stc{grid-column:1/-1}
 .ml{display:block}
 .camps.card{background:transparent;border:0;padding:0}
 .ad{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "ex" "act" "chart" "evi" "fb" "log"}
 .ad-act .pribtn{display:none}
 .sticky-act{display:flex;position:fixed;left:0;right:0;bottom:64px;padding:10px 14px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);z-index:48;gap:8px}
 .sticky-act .btn{flex:1;height:46px}
 main.has-sticky{padding-bottom:160px}
 .two,.three,.f2,.f3{grid-template-columns:1fr}
 .kv{grid-template-columns:1fr}
 .checks li{display:grid;grid-template-columns:24px 1fr;gap:2px 10px}.checks li>span:last-child{grid-column:2}.checks .lbl{min-width:0;font-size:12px}
 .btn{height:44px}.btn.sm{height:36px}
 .seg button{height:38px}
 .toasts{left:12px;right:12px;top:64px;max-width:none}
 .fab{bottom:76px;right:14px;height:44px}
 .coach{left:8px;right:8px;bottom:70px;width:auto;max-width:none}
 .coach p{font-size:13px}
 .ibtn .lbl{display:none}
 .modal-bg{align-items:flex-end;padding:0}
 .modal{border-radius:16px 16px 0 0;max-height:90vh}
 .sheet-bg{align-items:flex-end}
 .sheet{width:100%;height:auto;max-height:85vh;border-radius:16px 16px 0 0}
 .intro{flex-direction:column;align-items:flex-start}
 .senst tr{display:block;border-bottom:1px solid var(--line);padding:8px 0}.senst td{display:block;border:0;padding:4px 0;text-align:left!important}
 .ntab{min-width:560px}
 .intro .x{margin-left:0}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">pulse<b></b></div>
  <span class="proto">Concept prototype · simulated data</span>

/* ---------- campaigns & data generation ---------- */

      case 'rejected': f.stop = 'ad_rejected'; break;

function pushHour(c, h, o) { c.data[h] = o; for (const m of [...METRICS, 'tconv']) c.cum[m][h + 1] = c.cum[m][h] + o[m]; }

/* ---------- expected values (same hour & weekday, last 4 weeks) ---------- */
function E(c, h, m) { const a = c.ec[m]; if (a[h] !== undefined) return a[h]; const v = []; for (let k = 1; k <= 4; k++) { const o = c.data[h - 168 * k]; if (o && !o.paused) v.push(o[m]); } const r = med(v); if (h < S.h) a[h] = r; return r; }
function ER(c, h, m) { const v = []; for (let k = 1; k <= 4; k++) { const o = c.data[h - 168 * k]; if (o && !o.paused) v.push(o[m]); } if (!v.length) return { lo: 0, hi: 0, med: 0 }; return { lo: Math.min(...v), hi: Math.max(...v), med: med(v) }; }

function SA(c, h0, h1, m) { h0 = Math.max(0, h0); if (h1 < h0) return 0; return c.cum[m][h1 + 1] - c.cum[m][h0]; }

/* ---------- detection rules ---------- */
function evalRules(c, h, o) {

function evalAccount(h) {

function peerPct(rule, h) {

const sevRank = s => ({ P0: 0, P1: 1, P2: 2, P3: 3 }[s] ?? 4);

/* ---------- alert lifecycle ---------- */
function detect(h) {

function quickOK(a, h) {

function moneyLabel(a) { if (a.note) return 'Extra cost vs normal (all similar advertisers)'; return ({ delivery: 'Sales missed (est.)', under: 'Sales missed (est.)', budgetfc: 'Sales at risk (est.)', balance: 'At risk', fatiguefc: 'At risk', tracking: a.data.mode === 'double' ? 'Spend on wrong data' : 'Spent with no tracked results', landing: 'Spent on a broken page', suspicious: 'Spent on suspicious clicks', runaway: 'Extra spend vs normal', cvr: 'Wasted vs normal', cost: 'Extra cost vs normal', ctr: 'Lost efficiency', limit: 'Over your limit' })[a.rule] || 'At risk'; }

function createAlert(g, h) {

/* ---------- notifications ---------- */

/* ---------- segment insight & evidence ---------- */
function segInsight(c, h) {

function evidence(a, h) {

  if (c) {
    const q = c.data[h], h0 = h - 2;

    ev.website_update = c.siteUpdate != null && h - c.siteUpdate < 48 ? `around ${tLabel(c.siteUpdate)}` : 'none detected';
    ev.page_content_changed = c.pageChange != null && h - c.pageChange < 48 ? `yes, at ${tLabel(c.pageChange)} (offer text changed)` : 'no';
    if (a.si) { ev.segments = a.si.uniform ? 'all device/region slices moved equally' : `${a.si.worst.name}: cost per conversion ${a.si.worst.ratio.toFixed(1)}× normal; other slices normal`; ev.top_site = a.si.siteSpike ? `${a.si.siteSpike.name} sent ${Math.round(a.si.siteSpike.share * 100)}% of clicks (usually ${Math.round(a.si.siteSpike.eshare * 100)}%)` : 'no unusual site'; }

/* ---------- investigator: evidence → cause, confidence, action ---------- */
function investigate(a) {
  const ev = a.ev, c = camp(a.cids[0]), d = a.data || {}, si = a.si; const cn = c ? c.name : 'Your account';

  const C = (cause, score, why) => cands.push({ cause, score, why });
  const peersLine = `Only ${a.peers}% of similar advertisers saw anything like this, so it is specific to your account`;
  switch (a.rule) {
    case 'tracking':
      if (d.mode === 'zero') {

        const site = ev.website_update !== 'none detected';

      } else {

        C('Your conversion tag is firing twice for each order', 9, [`Conversions ${d.ratio.toFixed(1)}× expected, clicks ${ev.clicks_vs_expected}`, `Conversion tag: ${ev.conversion_tag}`, 'The same order ID is being reported more than once', peersLine]);
        C('A genuine spike in sales', 2, ['Possible but clicks did not rise']);
        x.cost = 'Results look better than they are. Budget and bid decisions are being made on inflated numbers.';
        x.ifWait = 'Bidding will push more money into this campaign because it looks twice as good as it really is.';
      }
      break;
    case 'landing':
      x.headline = `${cn}: your landing page is not loading (failed 2 checks in a row).`;
      C('Your website is down or returning an error', 10, [`Page check: ${ev.landing_page}`, `Clicks continue (${ev.clicks_vs_expected} vs usual), but visitors land on an error page`, 'Conversions fell close to zero at the same time', peersLine]);
      C('A conversion tracking issue', 2, ['']);
      x.cost = `${inr(so)} spent sending people to a broken page, about ${inr(ph)} an hour.`;
      x.ifWait = `Every hour costs about ${inr(ph)} with almost no sales. Pausing stops the loss right away.`;
      break;
    case 'runaway': {
      const edit = c.edits.filter(e => a.start - e.h < 24).slice(-1)[0];
      x.headline = `${cn}: spent ${inr(d.spend)} in the last hour, ${d.ratio.toFixed(1)}× the usual for this time.`;
      if (edit) C(`Daily budget was changed (${edit.text} at ${tLabel(edit.h)}) — this looks like an extra zero`, 10, [`Edit by ${edit.by} at ${tLabel(edit.h)}: ${edit.text}`, `Today’s spend is already ${inr(d.spentToday)} against a usual plan of ${inr(d.plan)}`, `Hourly spend is ${d.ratio.toFixed(1)}× normal`, peersLine]);
      C('A sudden surge of cheap inventory', 3, ['Spend rose without a settings change']);
      x.cost = `${inr(so)} spent above normal so far, about ${inr(ph)} extra each hour.`;
      x.ifWait = `At this pace the new budget of ${inr(d.budget)} could be fully spent today.`;
      break; }
    case 'delivery': {
      const n = a.cids.length;
      if (d.cause === 'payment_failed') { x.headline = `${n} campaign${n > 1 ? 's' : ''} stopped showing ads at ${tLabel(a.start)}.`; C('Your payment failed (card declined), so Media.net paused delivery on the whole account', 10, ['Payment status: failed', `${n} campaigns went to 0 impressions in the same hour`, 'Ad review and budgets are fine', peersLine]); }
      else if (d.cause === 'ad_rejected') { x.headline = `${cn}: ads stopped showing at ${tLabel(a.start)}.`; C(`Your ad was rejected in review: ${c.rejectReason || 'policy issue'}`, 10, ['Ad review status: rejected', 'Payment and budget are fine', 'Impressions fell to 0 the same hour']); }
      else { x.headline = `${cn}: 0 impressions in the last hour.`; C('Unknown — delivery stopped', 2, ['Payment, review and budget look fine']); }
      x.cost = `About ${inr(ph)} of sales missed every hour ads stay off (based on what this time usually brings).`;
      x.ifWait = `Ads stay off until this is fixed — about ${inr(ph * 6)} of sales missed by this evening.`;
      break; }
    case 'suspicious':
      x.headline = `${cn}: ${d.site} sent ${Math.round(d.share * 100)}% of clicks in the last 3 hours (usually 12%), with almost no conversions.`;
      C(`Likely invalid (bot) traffic from ${d.site}`, 9, [`${d.site} share of clicks: ${Math.round(d.share * 100)}% vs 12% usual`, `Conversion rate ${pc(d.cvr)} vs ${pc(d.ecvr)} usual`, 'Other sites are behaving normally', 'Media.net’s traffic-quality team has been notified; confirmed invalid clicks are credited back']);
      C('A genuine spike in interest from one site', 2, ['']);
      x.cost = `${inr(d.botSpend)} spent on suspicious clicks in the last 3 hours.`;
      x.ifWait = `Roughly ${inr(ph)} an hour keeps going to clicks that don’t convert.`;
      break;
    case 'cvr':
      x.headline = `${cn}: conversion rate is ${pc(d.cvr)} over the last 6 hours (usually ${pc(d.ecvr)}), while clicks are normal.`;
      C('Something on your landing page changed — offer, price or checkout', 3 + (ev.page_content_changed !== 'no' ? 5 : 0) + (si && si.uniform ? 2 : 0) + (ev.landing_page.startsWith('up') ? 1 : 0),
        [`Page content changed: ${ev.page_content_changed}`, `Landing page ${ev.landing_page}; conversion tag ${ev.conversion_tag}`, si && si.uniform ? 'All devices and regions dropped equally, so it is not one audience' : `Biggest change: ${ev.segments}`, peersLine]);
      C(`A problem in one audience slice (${si ? si.worst.name : ''})`, si && !si.uniform && si.worst.ratio > 2.2 ? 6 : 0, [ev.segments]);
      x.cost = `About ${inr(ph)} an hour is buying clicks that convert far less than usual.`;
      x.ifWait = `By tonight, about ${inr(ph * 8)} will have gone to clicks that rarely convert.`;
      break;
    case 'cost':
      if (d.mode === 'creep') { x.headline = `${cn}: cost per conversion has risen two weeks in a row (${inr(d.w3)} → ${inr(d.w2)} → ${inr(d.w1)}).`; C('Gradual audience saturation or rising competition', 7, ['Weekly cost per conversion up 20%+ twice in a row', 'No single day or slice explains it', peersLine]); C('Seasonal change', 3, ['']); x.cost = 'Each sale costs more every week.'; x.ifWait = 'If the trend continues, next week costs another ~20% more per sale.'; }
      else {
        x.headline = a.note ? `Cost per click is up about ${pctS(d.cpcRatio - 1)} for ${a.peers}% of Home & Décor advertisers in the last 6 hours.` : `${cn}: cost per conversion is ${inr(d.cpa)} over 6 hours (usually ${inr(d.ecpa)}).`;
        C(`${si ? si.worst.name : 'One slice'} is the problem: cost per conversion there is ${si ? si.worst.ratio.toFixed(1) : '?'}× normal; other slices are normal`, si && !si.uniform && si.worst.ratio > 1.7 ? 9 : 0, [ev.segments, `Overall cost per click ${pctS(d.cpcRatio - 1)} vs usual`, peersLine]);
        C('More competition in your auctions is pushing up cost per click', d.cpcRatio > 1.3 ? 6 : 1, [`Cost per click ${pctS(d.cpcRatio - 1)} vs usual`, 'Conversion rate is close to normal', `${a.peers}% of similar advertisers affected`]);
        C('Fewer visitors are converting', d.cpcRatio <= 1.3 ? 4 : 0, ['Cost per click is normal but conversions fell']);
        x.cost = a.note ? 'Your campaigns are moving in line with similar advertisers.' : `About ${inr(ph)} extra each hour compared with normal efficiency.`;
        x.ifWait = a.note ? 'No action needed. Pulse will alert you if your account starts behaving differently from similar advertisers.' : `By tonight about ${inr(ph * 8)} extra will have been spent for the same results.`;
      }
      break;
    case 'ctr':
      if (d.mode === 'trend') { x.headline = `${cn}: CTR has fallen 5 days in a row (${pc(d.days[0])} → ${pc(d.days[5])}).`; }
      else x.headline = `${cn}: CTR is ${pc(d.ctr)} over 24 hours (usually ${pc(d.ectr)}).`;
      C('Creative fatigue — the same people have seen this ad too often', 8, ['CTR declined steadily, not suddenly', 'Impressions and placements are normal', 'Conversion rate after the click is normal', peersLine]);
      C('Ad placement changed on publisher sites', 2, ['No publisher layout changes found']);
      x.cost = 'You pay for the same reach but get fewer clicks each day.';
      x.ifWait = 'CTR usually keeps falling 5–10% a day until the ad is refreshed.';
      break;
    case 'under':
      x.headline = `${cn}: on pace to spend only ${Math.round(d.ratio * 100)}% of a normal day (${inr(d.proj)} vs ${inr(d.eDay)}).`;
      C('Your bid is too low — you are winning far fewer auctions', 8, [`Impressions ${pctS(d.imprRatio - 1)} vs usual by this time`, 'Budget is available but not being spent', 'Ads are approved and payment is fine', peersLine]);
      C('Targeting is too narrow', 3, ['No targeting edits found']);
      x.cost = `About ${inr(ph)} of sales missed per hour compared with a normal day.`;
      x.ifWait = 'Today will end well below plan; evening peak hours are still ahead.';
      break;
    case 'budgetfc':
      x.headline = `${cn}: at this pace the budget runs out at ${tLabel(d.exAt)}. ${Math.round(d.share * 100)}% of your sales usually come after 6 PM.`;
      C(`Spending ${d.rate.toFixed(1)}× the usual pace this morning`, 9, [`Spend this hour is ${d.rate.toFixed(1)}× normal`, `Forecast: budget gone by ${tLabel(d.exAt)}`, `${Math.round(d.share * 100)}% of conversions usually happen 6 PM – midnight`]);
      x.cost = `About ${inr(ph * 6)} of evening sales at risk if ads stop early.`;
      x.ifWait = 'Ads stop showing during your best hours tonight.';
      break;
    case 'fatiguefc':
      x.headline = `${cn}: CTR has fallen 3 days in a row and will likely drop below target in about ${d.days} day${d.days > 1 ? 's' : ''}.`;
      C('Early creative fatigue', 8, [`Daily CTR: ${d.dc.map(pc).join(' → ')}`, `28-day average: ${pc(d.avg)}`, 'Refreshing now avoids paying for weaker clicks later']);
      x.cost = 'No money lost yet — this is an early warning.'; x.ifWait = 'CTR keeps sliding and each click gets more expensive.';
      break;
    case 'balance':
      x.headline = `Account balance ${inr(d.balance)} covers about ${d.days.toFixed(1)} days of spend.`;
      C('Spend is higher than your top-ups', 9, [`Average daily spend: ${inr(d.avg)}`, `Balance: ${inr(d.balance)}`]);
      x.cost = 'All campaigns stop when the balance hits zero.'; x.ifWait = `Ads could stop in about ${Math.max(1, Math.round(d.days * 24))} hours.`;
      break;
    case 'limit': {
      const t = { cpa: ['cost per conversion', inr(d.val), inr(d.lim)], daily: ['projected spend today', inr(d.val), inr(d.lim)], conv: ['projected conversions today', num(d.val), num(d.lim)] }[d.kind];
      x.headline = `Your ${t[0]} is ${t[1]}, beyond your limit of ${t[2]}.`;
      C('A limit you set has been crossed', 9, [`Limit: ${t[2]}`, `Current: ${t[1]}`]);
      x.cost = 'Based on your own business limit.'; x.ifWait = 'Pulse keeps checking every hour.';
      break; }
  }
  cands.sort((p, q) => q.score - p.score);
  const top = cands[0] || { cause: 'Unknown', score: 0, why: [] }, sec = cands[1] || { cause: '', score: 0 };
  x.conf = clamp(Math.round(45 + (top.score - sec.score) * 5 - (a.peers >= 20 && !a.note ? 10 : 0)), 35, 96);
  if (x.conf < 60) { x.cause = 'Not certain yet'; x.why = [`Most likely: ${top.cause}`, `Also possible: ${sec.cause}`, ...top.why.slice(0, 2)]; }
  else { x.cause = top.cause; x.why = top.why.filter(Boolean); }
  const acts = actionsFor(a); x.action = acts[0] ? acts[0].label : '';
  return x;
}

function actionsFor(a) {
  const r = a.rule, d = a.data || {}, L = [], P = (id, label) => L.push({ id, label });
  if (a.note) { P('gotit', 'Got it'); return L; }
  const c = camp(a.cids[0]);
  switch (r) {
    case 'tracking': if (d.mode === 'double') P('fixdup', 'Remove duplicate tag & re-check'); else P('testtag', 'Test conversion tag'); P('pause', 'Pause campaign'); break;
    case 'landing': P('pagefixed', 'Page is fixed — re-check'); P('pause', 'Pause until page is fixed'); break;
    case 'runaway': if (c && c.budget > c.planBudget) P('revert', 'Revert last edit'); P('cap', 'Set a spend cap'); P('pause', 'Pause campaign'); break;
    case 'delivery': if (d.cause === 'payment_failed') P('retrypay', 'Retry payment'); else if (d.cause === 'ad_rejected') P('fixad', 'Fix ad & resubmit'); else P('pause', 'Pause campaign'); break;
    case 'suspicious': P('exclude', `Exclude ${d.site || 'site'}`); P('pause', 'Pause campaign'); break;
    case 'cvr': P('offerfix', 'Check landing page offer'); P('pause', 'Pause campaign'); break;
    case 'cost': if (d.mode === 'creep') P('review', 'Review targeting & bids'); else if (a.si && !a.si.uniform && a.si.worst.ratio > 1.7) P('segbid', `Lower bid on ${a.si.worst.name}`); else P('lowerbid', 'Lower bid 10%'); P('pause', 'Pause campaign'); break;
    case 'ctr': case 'fatiguefc': P('refresh', 'Refresh ad copy (3 new versions)'); break;
    case 'under': P('raisebid', 'Raise bid 15%'); break;
    case 'budgetfc': P('spread', 'Spread budget evenly'); P('addbudget', 'Add 30% budget today'); break;
    case 'balance': P('addfunds', 'Add ₹2,00,000'); break;
    case 'limit': P('review', 'Review campaigns'); break;
  }
  return L;
}

function answerAsk(a, q) {
  const s = q.toLowerCase(), ex = a.ex, ev = a.ev;
  if (/wait|later|evening|tomorrow|ignore/.test(s)) return `${ex.ifWait} Right now it costs about ${inr(a.atRisk)} an hour.`;
  if (/sure|confiden|why|how do you know|evidence|reason/.test(s)) return `Confidence is ${ex.conf}%. ${ex.why.join('. ')}.`;
  if (/only me|others|peer|similar|everyone|market|competit/.test(s)) return `${ev.similar_advertisers_affected} of similar Home & Décor advertisers saw the same change. ${a.peers >= 60 ? 'This is a market-wide movement.' : 'This is specific to your account.'}`;
  if (/cost|money|spent|lose|loss|₹|rupee/.test(s)) return ex.cost;
  if (/fix|do|action|should|next/.test(s)) return `Recommended: “${ex.action}”. ${actionsFor(a).length > 1 ? 'Other options: ' + actionsFor(a).slice(1).map(x => x.label).join(', ') + '.' : ''}`;
  if (/tag|track|pixel/.test(s)) return `Conversion tag status: ${ev.conversion_tag || 'n/a'}. Website update: ${ev.website_update || 'n/a'}.`;
  if (/page|site|landing/.test(s)) return `Landing page: ${ev.landing_page || 'n/a'}. Page content changed: ${ev.page_content_changed || 'n/a'}.`;
  if (/device|mobile|region|tier|slice|segment/.test(s)) return ev.segments ? `Slices: ${ev.segments}.` : 'No slice breakdown for this alert.';
  return `I can only answer from this alert’s checks: cause (${ex.cause}), confidence (${ex.conf}%), cost so far (${inr(a.spent)}), similar advertisers (${ev.similar_advertisers_affected}) and the recommended action (${ex.action}).`;
}

/* ---------- actions ---------- */
function setVerifying(a, text) { a.status = 'verifying'; a.vok = 0; a.vfail = 0; a.clear = 0; logA(a, S.h - 1, `${S.settings.profile.name}: ${text}. Pulse will re-check over the next 2 hours.`); }
function removeInj(type, cid) {
  S.inj = S.inj.filter(i => !(i.type === type && (i.cid === cid || !i.cid)));
  for (const c of S.camps) for (const t of c.truth) if (t.type === type && t.to == null && (!cid || c.id === cid)) t.to = S.h;
  const c = camp(cid);
  if (type === 'tracking' && c) c.tagOk = true;
  if (type === 'payment') S.acct.payment = false;
  if (type === 'rejected' && c) c.rejectReason = null;
}
function doAction(a, id) {
  const c = camp(a.cids[0]), h = S.h - 1;
  switch (id) {
    case 'gotit': resolveAlert(a, h, 'Dismissed by you.', 0); break;
    case 'pause': for (const cid of a.cids) camp(cid).paused = true; logA(a, h, `${S.settings.profile.name} paused ${a.cids.length > 1 ? a.cids.length + ' campaigns' : c.name}.`); resolveAlert(a, h, 'Campaign paused — no more money at risk.', 1); break;
    case 'resume': for (const cid of a.cids) camp(cid).paused = false; logA(a, h, 'Campaign resumed.'); break;
    case 'testtag': modal(`<h2>Conversion tag test</h2><p class="muted">Pulse sent a test order to <b>${esc(c.name)}</b>’s thank-you page.</p>
        <ul class="checks"><li><span class="ck y">✓</span><span>Landing page loaded (1.8 s)</span></li><li><span class="ck y">✓</span><span>Click ID reached your site</span></li><li><span class="ck n">✕</span><span>Conversion tag: <b>no signal received</b>. Last signal ${c.siteUpdate != null ? tLabel(c.siteUpdate + 1) : 'earlier today'}, right after your website update.</span></li></ul>
        <p class="small muted mt">Most likely the tag was removed from the order-confirmation page during the update. Re-add the snippet, then re-check.</p>
        <div class="act"><button class="btn" data-do="close">Close</button><button class="btn pri" data-do="act2" data-a="${a.id}" data-x="tagfixed">I’ve re-added the tag — re-check</button></div>`); return;
    case 'tagfixed': removeInj('tracking', c.id); setVerifying(a, 're-added the conversion tag'); break;
    case 'fixdup': removeInj('double', c.id); setVerifying(a, 'removed the duplicate tag'); break;
    case 'pagefixed': removeInj('pagedown', c.id); setVerifying(a, 'marked the landing page as fixed'); break;
    case 'revert': { const old = c.budget; c.budget = c.planBudget; removeInj('runaway', c.id); c.edits.push({ h: S.h, text: `Daily budget ${inr(old)} → ${inr(c.budget)} (reverted)`, by: S.settings.profile.name, perf: false }); setVerifying(a, `reverted the budget to ${inr(c.budget)}`); break; }
    case 'cap': modal(`<h2>Set a spend cap</h2><p class="muted">Today’s cap for <b>${esc(c.name)}</b>. Usual plan: ${inr(c.planBudget)}.</p><div class="field"><label>Daily cap (₹)</label><input id="capv" type="number" inputmode="numeric" value="${Math.round(c.planBudget)}"></div>
        <div class="act"><button class="btn" data-do="close">Cancel</button><button class="btn pri" data-do="act2" data-a="${a.id}" data-x="capset">Set cap</button></div>`); return;
    case 'capset': { const v = +document.getElementById('capv').value || c.planBudget; c.budget = v; c.planBudget = v; removeInj('runaway', c.id); c.edits.push({ h: S.h, text: `Daily cap set to ${inr(v)}`, by: S.settings.profile.name, perf: false }); setVerifying(a, `set a daily cap of ${inr(v)}`); break; }
    case 'retrypay': removeInj('payment', null); setVerifying(a, 'retried payment (succeeded)'); break;
    case 'fixad': modal(`<h2>Fix ad & resubmit</h2><p class="muted">Rejected text: “Guaranteed lowest price in India”. Reason: ${esc(c.rejectReason || '')}.</p><div class="field"><label>Suggested compliant headline</label><input id="adtxt" value="Handpicked home décor at honest prices"></div>
        <div class="act"><button class="btn" data-do="close">Cancel</button><button class="btn pri" data-do="act2" data-a="${a.id}" data-x="adresub">Resubmit for review</button></div>`); return;
    case 'adresub': removeInj('rejected', c.id); setVerifying(a, 'edited the ad and resubmitted (approved)'); break;
    case 'exclude': { const credit = Math.round(a.data.botSpend || 0); c.excluded.push(4); removeInj('bots', c.id); S.acct.balance += credit; setVerifying(a, `excluded CityGuide; ${inr(credit)} of invalid clicks credited back`); break; }
    case 'offerfix': modal(`<h2>Landing page check</h2><p class="muted">Pulse compared <b>${esc(c.name)}</b>’s landing page with yesterday.</p><ul class="checks"><li><span class="ck n">✕</span><span>Offer text changed at ${c.pageChange != null ? tLabel(c.pageChange) : 'today'}: the banner still says “30% off” but the code at checkout returns “expired”.</span></li><li><span class="ck y">✓</span><span>Page loads normally; tag fires</span></li></ul>
        <div class="act"><button class="btn" data-do="close">Close</button><button class="btn pri" data-do="act2" data-a="${a.id}" data-x="offerok">Offer updated — re-check</button></div>`); return;
    case 'offerok': removeInj('offer', c.id); c.pageChange = null; setVerifying(a, 'updated the offer on the landing page'); break;
    case 'segbid': removeInj('segcost', c.id); setVerifying(a, `lowered the bid on ${a.si ? a.si.worst.name : 'the slice'} by 40%`); break;
    case 'lowerbid': c.bid *= 0.9; removeInj('market', null); setVerifying(a, 'lowered the bid by 10%'); break;
    case 'raisebid': c.bid *= 1.05; removeInj('under', c.id); c.edits.push({ h: S.h, text: 'Bid +15%', by: S.settings.profile.name, perf: false }); setVerifying(a, 'raised the bid by 15%'); break;
    case 'refresh': { const base = c.name.split('–')[0].trim();
      const v = [[`${base}: new styles just in`, 'Fresh colours for every room. Free delivery over ₹999.'], [`Make your home feel new — ${base}`, 'Handpicked pieces, easy 7-day returns.'], [`${base} your guests will notice`, 'Loved by 20,000+ homes. Shop the edit.']];
      modal(`<h2>Refresh ad copy</h2><p class="muted">Three new versions written from your campaign and past top performers. Pick one.</p>${v.map((x, i) => `<div class="variant${i === 0 ? ' on' : ''}" data-do="pickvar"><b>${esc(x[0])}</b><span class="small muted">${esc(x[1])}</span></div>`).join('')}
        <div class="act"><button class="btn" data-do="close">Cancel</button><button class="btn pri" data-do="act2" data-a="${a.id}" data-x="refreshed">Use selected version</button></div>`); return; }
    case 'refreshed': removeInj('fatigue', c.id); setVerifying(a, 'switched to a refreshed ad'); break;
    case 'spread': removeInj('fastspend', c.id); setVerifying(a, 'turned on even pacing'); break;
    case 'addbudget': c.budget = Math.round(c.budget * 1.3); c.planBudget = c.budget; c.edits.push({ h: S.h, text: `Budget +30% to ${inr(c.budget)}`, by: S.settings.profile.name, perf: false }); setVerifying(a, 'added 30% budget for today'); break;

    case 'review': modal(`<h2>Review suggestions</h2><ul class="why"><li>Exclude the two lowest-converting sites from the last 14 days.</li><li>Shift 15% of budget from Tier-2 desktop to Mobile · Metro.</li><li>Refresh the ad if CTR is also falling.</li></ul><div class="act"><button class="btn pri" data-do="close">OK</button></div>`); logA(a, h, 'Opened review suggestions.'); return;
  }
  closeModal(); render();
}

/* ---------- injection ---------- */
function inject(type, cid, size) {
  size = size || 'strong'; const h = S.h;
  if (!INJ[type].c) cid = null;
  if (type === 'lowbal') { S.acct.balance = Math.min(S.acct.balance, 60000); toast('Injected: low account balance (₹60,000). Detection runs next hour.', 'info'); render(); return; }
  S.inj = S.inj.filter(x => !(x.type === type && x.cid === cid));
  S.inj.push({ id: ++S.iid, type, cid, size, start: h });
  const c = cid ? camp(cid) : null;
  if (c) { c.cool = {}; c.paused = false; }
  if (type === 'tracking') { c.tagOk = false; c.siteUpdate = h - 1; }
  if (type === 'runaway') { const nb = c.planBudget * 10; c.edits.push({ h: h - 1, text: `Daily budget ${inr(c.budget)} → ${inr(nb)}`, by: 'Meera', perf: false }); c.budget = nb; }
  if (type === 'offer') c.pageChange = h;
  if (type === 'rejected') c.rejectReason = 'the claim “Guaranteed lowest price in India” is not allowed without proof';
  if (type === 'payment') S.acct.payment = true;
  if (type === 'market') S.camps.forEach(x => { x.cool = {}; });
  else if (type === 'payment') S.camps.forEach(x => { x.cool = {}; x.truth.push({ type, from: h, to: null }); });
  else c.truth.push({ type, from: h, to: null });
  toast(`Injected: ${INJ[type].n}${c ? ' on ' + c.name : ''}. Pulse detects it from the data over the next simulated hour(s).`, 'info');
  render();
}
function resetDemo() {
  for (const i of S.inj.slice()) removeInj(i.type, i.cid);
  S.inj = []; S.acct.payment = false;
  for (const c of S.camps) { c.budget = c.planBudget; c.tagOk = true; c.paused = false; c.excluded = []; c.bid = 1; c.pageChange = null; c.rejectReason = null; c.cool = {}; }
  for (const a of S.alerts) if (a.status !== 'resolved') resolveAlert(a, S.h - 1, 'Closed by demo reset.', 0);
  S.pending = {}; toast('Demo reset: all campaigns back to normal.', 'ok'); render();
}

/* ---------- 30-day replay ---------- */
function replay(sensMap, from, to) {
  from = from ?? S.h - 720; to = to ?? S.h - 1;
  const lv = r => SENS[sensMap[r] || 'M']; const res = { total: 0, real: 0, swings: 0, missed: 0, byRule: {}, fired: [] };
  for (const c of S.camps) {
    const open = {}, streak = {}, fired = [];
    for (let h = from; h <= to; h++) {
      let cs = evalRules(c, h, { sens: lv, replay: true });

    for (const f of fired) {
      const real = c.truth.some(t => f.h >= t.from - 2 && f.h <= (t.to ?? S.h) + 8);
      f.real = real; res.total++; real ? res.real++ : res.swings++;

    for (const t of c.truth) if (t.from >= from && t.from <= to && !fired.some(f => f.h >= t.from - 2 && f.h <= (t.to ?? S.h) + 8)) res.missed++;
  }

}

    text: () => `<p>Meera never types a threshold. Pulse learns what’s normal for each campaign from its own history. She only picks <b>Low / Medium / High</b>.</p><p>The <b>30-day replay</b> shows what her settings would have sent last month: <b>${T.base.total} alerts</b>, ${T.base.real} real issues, ${T.base.swings} normal swings.</p>` },
  { title: 'See the trade-off before saving', page: '#/settings', hl: '#replayBox',
    before() { T.prev = { ...S.settings.sens }; NINE.forEach(r => { if (RULES[r].sev === 'P1') S.settings.sens[r] = 'H'; }); S.replayRes = replay(S.settings.sens); T.high = S.replayRes; },
    text: () => `<p>We switched the P1 rules to <b>High</b>. Last month that would have meant <b>${T.high.total} alerts instead of ${T.base.total}</b> — ${T.high.swings} of them just normal swings.</p><p>That’s how Meera avoids alert fatigue: she sees the cost of a setting before she saves it.</p>` },
  { title: 'That’s Pulse', page: '#/', hl: null,
    before() { if (T.prev) S.settings.sens = T.prev; S.replayRes = null; quietReset(null); },
    text: () => `<p><b>Detect → explain → fix → verify.</b></p><p>Now explore on your own: open <b>Demo controls</b> to inject any of 14 problems, then press <b>Next hour</b> in the top bar to watch Pulse catch it.</p>`, last: true },
];
function startTour() { closeModal(); S.playing = false; S.tour = { i: 0, focus: null }; document.body.classList.add('touring'); runTourStep(); }
function endTour() { document.querySelectorAll('.hl').forEach(e => e.classList.remove('hl')); if (S.tour) { S.tour = null; } document.body.classList.remove('touring'); document.getElementById('coach').innerHTML = ''; render(); }
function tourNext() { if (!S.tour) return; if (TOUR[S.tour.i].last) { endTour(); go('#/'); return; } S.tour.i++; runTourStep(); }
function runTourStep() {
  const st = TOUR[S.tour.i];
  try { st.before && st.before(); } catch (e) { console.error(e); }
  if (st.page && location.hash !== st.page) location.hash = st.page; else render();
  setTimeout(() => { render(); drawCoach(); }, 30);
}
function drawCoach() {
  if (!S.tour) return; const st = TOUR[S.tour.i], n = TOUR.length, i = S.tour.i;
  document.getElementById('coach').innerHTML = `<div class="coach" role="dialog" aria-label="Guided tour"><div class="ch"><span>Step ${i + 1} of ${n}</span><span class="prog"><i style="width:${(i + 1) / n * 100}%"></i></span><span>${tLabel(S.h)}</span></div>
   <div class="cb"><h3>${esc(st.title)}</h3>${st.text()}${st.what ? `<div class="what">${esc(st.what)}</div>` : ''}
   <div class="cbtn"><button class="btn sm" data-do="texit">Exit tour</button><button class="btn pri" data-do="tnext">${st.last ? 'Finish' : st.what ? 'Move time forward ›' : 'Next ›'}</button></div></div></div>`;
  applyHL(true);
}
function applyHL(scroll) {
  document.querySelectorAll('.hl').forEach(e => e.classList.remove('hl'));
  const st = S.tour && TOUR[S.tour.i]; if (!st || !st.hl) { if (scroll) window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  const el = document.querySelector('#view ' + st.hl); if (!el) return; el.classList.add('hl');
  if (scroll) { const mob = window.innerWidth < 768; const y = el.getBoundingClientRect().top + window.scrollY - (mob ? 70 : 90); window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' }); }
}

/* ---------- main loop ---------- */
function tick(silent) { const h = S.h; let spend = 0; for (const c of S.camps) { genHour(c, h); spend += c.data[h].spend; } S.acct.balance = Math.max(0, S.acct.balance - spend); S.h++; detect(h); S.lastTick = Date.now(); if (!silent) render(true); }
function loop() { if (S.playing && !S.tour) tick(); S.timer = setTimeout(loop, S.speed); }
function restartLoop() { clearTimeout(S.timer); S.lastTick = Date.now(); S.timer = setTimeout(loop, S.speed); render(true); }

/* ---------- init ---------- */
function init() {
  S.camps = CDEF.map(mkCamp);
  for (let i = 0; i < 30; i++) S.peers.push({ s: 101 + i * 17, mkt: i < 21 });
  const D = DAYS_HIST;
  plant(camp('c2'), 'tracking', D - 26, 11, 17); plant(camp('c5'), 'rejected', D - 21, 9, 15); plant(camp('c1'), 'pagedown', D - 15, 13, 20); plant(camp('c4'), 'under', D - 9, 0, 23); plant(camp('c3'), 'offer', D - 5, 10, 22);
  for (let h = 0; h < START; h++) for (const c of S.camps) genHour(c, h);
  S.h = START;
  S.hist = replay(S.settings.sens, S.h - 168, S.h - 1);
  render(); S.timer = setTimeout(loop, S.speed);
}
init();
</script>
</body>
